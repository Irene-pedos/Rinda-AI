# Development only. Prints OTPs to the log, loads demo data and turns on Swagger UI.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/demo

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

rinda:
  otp:
    log-to-console: true
  plots:
    # Invented parcels for zero-code UPIs (mock-registry/parcels.json), so the "type the UPI, see the parcel"
    # screen can be tested. Never in production: there the farmer's own e-title is the record (DOCUMENT).
    land-registry-provider: MOCK

# The log also goes to a file, so scripts\demo-check.ps1 can read the login codes. Ignored by git.
logging:
  file:
    name: ../logs/backend-dev.log
